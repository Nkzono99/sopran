site_name: SOPRAN
site_description: 衛星観測データの取得、解析、可視化、保存を一貫して扱う Python ライブラリ
repo_url: https://github.com/Nkzono99/sopran
repo_name: Nkzono99/sopran
site_url: https://nkzono99.github.io/sopran/
strict: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  language: ja
  custom_dir: docs/overrides
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.footer
    - toc.follow
    - content.code.copy

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: ja
          default: true
          name: 日本語
          build: true
        - locale: en
          name: English
          build: true
          site_description: Python library for retrieving, analyzing, visualizing, and storing satellite observations
          nav_translations:
            ホーム: Home
            はじめる: Getting Started
            インストール: Installation
            最初の図を描く: First Plot
            データの構造をたどる: Exploring Data
            解析条件を残す: Reproducible Analysis
            ガイド: User Guide
            読み込んだ配列を扱う: Working With Arrays
            可視化: Plotting
            期間・領域・解析条件: Time, Regions, And Cases
            設定: Configuration
            Storeにデータを保存する: Storing Data
            Storeを別マシンへ運ぶ: Moving A Store
            時刻をそろえる: Time Alignment
            座標変換: Coordinate Frames
            バッチ処理: Batch Pipelines
            データ: Data
            データ一覧: Overview
            概要: Overview
            PACE ESAのmode判定: PACE ESA Mode Policy
            LMAGと軌道: LMAG And Orbit
            月面: Moon
            月面マップ: Moon Maps
            磁気異常カタログ: Magnetic Anomaly Catalog
            試作API: Experimental
            方針と一覧: Policy And Inventory
            電子反射法: Electron Reflectometry
            ERモデルの定義: ER Model Definitions
            ER全期間バッチ: ER Full-Period Batch
            波動候補の抽出: Wave Candidates
            dHT座標系: dHT Frame
            衛星電位の代理量: Spacecraft Potential Proxies
            磁場モデルと軌道: Field Models And Orbits
            リファレンス: Reference
            スキーマ: Schemas
            Storeのファイル構造: Store Layout
            コマンドライン: Command Line
            用語集: Glossary
            開発: Development
            設計方針: Design Principles
            開発環境と検証: Setup And Checks
            データ源を追加する: Adding A Data Source
            ドキュメントの書き方: Writing Documentation
            リリース: Release
            ライセンスと移植: License And Porting
  # The ja and en builds render the same API objects; link each page to its own language.
  - autorefs:
      resolve_closest: true
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            heading_level: 3

extra:
  sopran_language_switcher:
    label: "Lang: 日本語/English"
    fallback_language: ja

extra_css:
  - assets/stylesheets/sopran.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

nav:
  - ホーム: index.md
  - はじめる:
      - インストール: start/install.md
      - 最初の図を描く: start/quickstart.md
      - データの構造をたどる: start/explore.md
      - 解析条件を残す: start/reproducible.md
  - ガイド:
      - 読み込んだ配列を扱う: guide/arrays.md
      - 可視化: guide/plotting.md
      - 期間・領域・解析条件: guide/views-cases.md
      - 設定: guide/configuration.md
      - Storeにデータを保存する: guide/store.md
      - Storeを別マシンへ運ぶ: guide/store-sync.md
      - 時刻をそろえる: guide/alignment.md
      - 座標変換: guide/frames.md
      - バッチ処理: guide/pipeline.md
  - データ:
      - データ一覧: data/index.md
      - KAGUYA:
          - 概要: data/kaguya/index.md
          - PACE: data/kaguya/pace.md
          - PACE ESAのmode判定: data/kaguya/esa-mode-policy.md
          - LMAGと軌道: data/kaguya/lmag-orbit.md
          - LRS: data/kaguya/lrs.md
      - ARTEMIS: data/artemis.md
      - OMNI: data/omni.md
      - 月面:
          - 月面マップ: data/moon/index.md
          - 磁気異常カタログ: data/moon/magnetic-anomalies.md
  - 試作API:
      - 方針と一覧: experimental/index.md
      - 電子反射法: experimental/er.md
      - ERモデルの定義: experimental/er-models.md
      - ER全期間バッチ: experimental/er-batch.md
      - 波動候補の抽出: experimental/waves.md
      - dHT座標系: experimental/dht.md
      - 衛星電位の代理量: experimental/spacecraft-potential.md
      - 磁場モデルと軌道: experimental/field-models.md
  - リファレンス:
      - Python API: reference/api.md
      - スキーマ: reference/schemas.md
      - Storeのファイル構造: reference/store-layout.md
      - コマンドライン: reference/cli.md
      - 用語集: reference/glossary.md
  - 開発:
      - 設計方針: development/design.md
      - 開発環境と検証: development/setup.md
      - データ源を追加する: development/extending.md
      - ドキュメントの書き方: development/documentation.md
      - リリース: development/release.md
      - ライセンスと移植: development/license.md
