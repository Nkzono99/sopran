[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "sopran"
version = "0.0.0"
description = "Satellite Observation Package for Retrieval, Analysis, and Navigation"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "SOPRAN contributors" },
]
keywords = [
  "satellite",
  "space-physics",
  "planetary-science",
  "kaguya",
  "artemis",
  "polars",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
]

[project.scripts]
sopran-env-check = "sopran.env_check:main"
sopran-schema-docs = "sopran.schema_docs:main"
sopran-store = "sopran.core.sync:main"

[project.optional-dependencies]
# Each extra lists only packages that SOPRAN imports on that path.
analysis = [
  "scipy>=1.11",
]
experimental = [
  "scipy>=1.11",
]
kaguya = [
  "cdflib>=1.3",
  "polars>=1.0",
  "pyarrow>=15.0",
  "scipy>=1.11",
  "spiceypy>=6.0",
  "xarray>=2024.3",
]
artemis = [
  "cdflib>=1.3",
  "xarray>=2024.3",
]
moon = [
  "rasterio>=1.4",
  "spiceypy>=6.0",
]
viz = [
  "matplotlib>=3.8",
  "panel>=1.4",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-autorefs>=1.1",
  "mkdocs-material>=9.5",
  "mkdocs-static-i18n>=1.3",
  "mkdocstrings[python]>=0.25",
  "pymdown-extensions>=10.8",
]
full = [
  "cdflib>=1.3",
  "matplotlib>=3.8",
  "panel>=1.4",
  "polars>=1.0",
  "pyarrow>=15.0",
  "rasterio>=1.4",
  "scipy>=1.11",
  "spiceypy>=6.0",
  "xarray>=2024.3",
]
dev = [
  "build>=1.2",
  "cdflib>=1.3",
  "maturin>=1.9",
  "mypy>=1.10",
  "pandas-stubs>=2.1",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "twine>=6.0",
]

[tool.maturin]
manifest-path = "crates/sopran-native/Cargo.toml"
python-source = "src"
module-name = "sopran._native"
features = ["extension-module"]
exclude = [
  "sopran/*.pdb",
  "src/sopran/*.pdb",
]
include = [
  { path = "LICENSE", format = "sdist" },
  { path = "NOTICE", format = "sdist" },
  { path = "README.md", format = "sdist" },
  { path = "THIRD_PARTY_NOTICES.md", format = "sdist" },
  { path = "docs/**/*", format = "sdist" },
  { path = "mkdocs.yml", format = "sdist" },
  { path = "src/sopran/py.typed", format = "wheel" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -m 'not network'"
markers = [
    "network: reaches the real remote archives; run with `pytest -m network`",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["cdflib", "spiceypy", "zarr.*"]
ignore_missing_imports = true
follow_imports = "skip"
